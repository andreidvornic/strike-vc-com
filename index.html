<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Strike Ventures — We don't compete, we collaborate</title>
<meta name="description" content="Strike Ventures — a new model for early growth investing. The best deals are not hard to find. They are hard to access." />
<meta property="og:title" content="Strike Ventures" />
<meta property="og:description" content="A new model for early growth investing. We don't compete, we collaborate." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#0B0828" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 0 L13.6 10.4 L24 12 L13.6 13.6 L12 24 L10.4 13.6 L0 12 L10.4 10.4 Z' fill='%23FF2E7E'/></svg>" />

<style>
  :root {
    --ink:        #0B0828;
    --white:      #FFFFFF;
    --off:        #E8E7F0;
    --mute:       #8E8DAF;
    --magenta:    #FF2E7E;
    --sky:        #98C6F7;

    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --sans:  'Geist', 'Inter', system-ui, sans-serif;
    --mono:  'Geist Mono', ui-monospace, monospace;

    /* Fluid horizontal / vertical page padding */
    --pad-x: clamp(24px, 6.25vw, 120px);
    --pad-y: clamp(28px, 5.2vh, 56px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  ::selection { background: var(--magenta); color: #fff; }

  body {
    background: var(--ink);
    color: var(--off);
    font-family: var(--sans);
    font-weight: 400;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    min-height: 100dvh;
  }
  *:focus-visible { outline: 2px solid var(--magenta); outline-offset: 4px; border-radius: 2px; }

  /* Subtle starfield */
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0, transparent 50%),
      radial-gradient(1px 1px at 70% 60%, rgba(152,198,247,0.25) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 85% 20%, rgba(255,255,255,0.3) 0, transparent 50%),
      radial-gradient(1px 1px at 30% 80%, rgba(255,46,126,0.3) 0, transparent 50%),
      radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.2) 0, transparent 50%),
      radial-gradient(1px 1px at 90% 75%, rgba(255,255,255,0.25) 0, transparent 50%),
      radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,0.2) 0, transparent 50%),
      radial-gradient(1px 1px at 45% 45%, rgba(152,198,247,0.2) 0, transparent 50%);
  }

  /* ── Page shell: fills the viewport, no letterboxing ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: var(--pad-y) var(--pad-x);
    padding-top: max(var(--pad-y), env(safe-area-inset-top));
    padding-bottom: max(var(--pad-y), env(safe-area-inset-bottom));
  }

  /* Brand */
  header.top {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: clamp(15px, 1.6vw, 22px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--white);
  }
  .brand-mark .spark { color: var(--magenta); display: inline-block; vertical-align: middle; width: 1em; height: 1em; }

  /* Dot-grid ornament — top-right */
  .dot-grid {
    position: absolute;
    right: var(--pad-x);
    top: clamp(96px, 14.8vh, 160px);
    display: grid;
    grid-template-columns: repeat(8, clamp(9px, 0.73vw, 14px));
    gap: clamp(11px, 0.94vw, 18px);
    opacity: 0.85;
    z-index: 1;
  }
  .dot-grid i { width: 100%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,0.18); }
  .dot-grid i.on { background: var(--magenta); }

  /* ── Hero: two columns, baseline-aligned (matches the deck) ── */
  .hero {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: clamp(40px, 5.2vw, 100px);
    align-items: end;
    padding: clamp(40px, 6vh, 120px) 0 clamp(8px, 2vh, 24px);
  }
  .hero-lede { align-self: center; }

  .eyebrow {
    font-family: var(--mono);
    font-size: clamp(12px, 0.92vw, 17px);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--magenta);
    font-weight: 500;
    display: inline-flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: clamp(24px, 3vw, 52px);
  }
  .eyebrow::before { content: ''; width: 26px; height: 1px; background: var(--sky); display: inline-block; flex: none; margin-top: 0.6em; }

  .title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(32px, 5.5vw, 104px);
    line-height: 1.0;
    letter-spacing: -0.035em;
    color: var(--white);
    margin: 0;
  }
  .title span { display: block; }
  .title em { font-style: italic; color: var(--magenta); }

  .aside {
    border-top: 1px solid rgba(255,255,255,0.22);
    padding-top: clamp(22px, 1.9vw, 36px);
  }
  .aside .quote {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(21px, 1.95vw, 30px);
    line-height: 1.25;
    color: var(--white);
    margin: 0 0 clamp(26px, 2.6vw, 40px);
  }
  .aside .meta {
    display: flex;
    justify-content: flex-start;
    gap: 12px;
    align-items: baseline;
    font-family: var(--mono);
    font-size: clamp(12px, 0.9vw, 15px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--off);
  }
  .aside .meta .sep { color: var(--mute); }

  /* ── Contact — bottom-left (only addition vs. deck cover) ── */
  footer.bottom {
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
  }
  a.email {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(20px, 2.3vw, 30px);
    line-height: 1;
    white-space: nowrap;
    color: var(--off);
    text-decoration: none;
    position: relative;
    display: inline-block;
    padding: 0 2px 6px;
    transition: color 0.45s ease;
  }
  a.email::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    height: 1px; width: 100%;
    background: var(--magenta);
    transform: scaleX(0.22);
    transform-origin: left;
    transition: transform 0.55s cubic-bezier(.2,.7,.2,1);
  }
  a.email:hover, a.email:focus-visible { color: var(--magenta); outline: none; }
  a.email:hover::after, a.email:focus-visible::after { transform: scaleX(1); }
  a.email .arrow {
    display: inline-block;
    transform: translateX(0);
    transition: transform 0.45s cubic-bezier(.2,.7,.2,1);
    margin-left: 14px;
    font-style: normal;
    color: var(--magenta);
    opacity: 0.7;
  }
  a.email:hover .arrow, a.email:focus-visible .arrow { transform: translateX(8px); opacity: 1; }

  /* ── Portrait / narrower screens: stack into one column ── */
  @media (max-width: 1180px) {
    .dot-grid { display: none; }
    .hero {
      grid-template-columns: 1fr;
      align-items: start;
      gap: clamp(36px, 7vw, 56px);
      padding: clamp(36px, 8vh, 80px) 0 clamp(24px, 5vh, 48px);
    }
    .hero-lede { align-self: start; }
    .aside { max-width: 44ch; }
  }

  /* Short / small phones: allow gentle scroll instead of crushing */
  @media (max-height: 620px) {
    .page { min-height: auto; }
    body { overflow-y: auto; }
  }
  @media (max-width: 420px) {
    .hero { padding-top: clamp(28px, 6vh, 56px); }
    a.email { font-size: 18px; }
  }
</style>
</head>
